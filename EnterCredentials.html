<!DOCTYPE html>
<!--
  Security-awareness training simulation (controlled environment).
  This form looks like a real registration gate on purpose - that realism
  IS the lesson. On submit, js/credentials.js discards every value the
  person typed (name, username, AND password) and stores ONLY a
  de-identified "someone fell for it" event. Nothing sensitive is sent
  to Supabase in any form, hashed or otherwise.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create your free account &mdash; TechBrief</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main>
    <div class="card">
      <div class="emblem" aria-hidden="true">
        <span class="d1"></span>
        <span class="d2"></span>
      </div>

      <h1>Create your free account</h1>
      <p class="subtitle" id="gateSubtitle">Register to unlock the full briefing and certification resources.</p>

      <section class="step active" id="registerStep">
        <div class="field">
          <label for="firstName">First name</label>
          <input id="firstName" type="text" autocomplete="off" placeholder="First name">
        </div>

        <div class="field">
          <label for="middleName">Middle name</label>
          <input id="middleName" type="text" autocomplete="off" placeholder="Middle name">
        </div>

        <div class="field">
          <label for="lastName">Last name</label>
          <input id="lastName" type="text" autocomplete="off" placeholder="Last name">
        </div>

        <div class="field">
          <label for="username">Username</label>
          <input id="username" type="text" autocomplete="off" placeholder="Choose a username">
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="password-field">
            <input id="password" type="password" autocomplete="off" placeholder="Create a password">
            <button type="button" class="password-toggle" id="passwordToggle">SHOW</button>
          </div>
        </div>

        <button type="button" class="btn btn-primary" id="registerButton">Create Account</button>
        <p class="error-text" id="registerError"></p>
        <p class="status-text" id="statusMessage"></p>
      </section>
    </div>
  </main>

  <footer>
    Powered by <a href="#">TechBrief Accounts</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/credentials.js"></script>
</body>
</html>
